name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # Run tests before release
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: TypeScript Type Check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build Transform
        run: bun run build:transform

      - name: Test Transform
        run: bun run test:transform

      - name: Test Runtime Benchmark Tooling
        run: bun run test:bench:runtimes

      - name: Run Tests (Slow)
        run: JSON_USE_FAST_PATH=0 bun run test:ci -- --no-cache

      - name: Run Tests (Fast)
        run: JSON_USE_FAST_PATH=1 bun run test:ci -- --no-cache

      - name: Run Strict Public Tests (Slow)
        run: JSON_USE_FAST_PATH=0 bun run test:rfc:public -- --no-cache

      - name: Run Strict Tests (Fast)
        run: JSON_USE_FAST_PATH=1 bun run test:rfc -- --no-cache

      - name: Check Package Contents
        run: npm pack --dry-run --ignore-scripts

  # Create GitHub Release
  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build Transform
        run: bun run build:transform

      - name: Generate Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v suffix=" - v${VERSION}" '
            /^## / {
              if (printing) exit
              printing = substr($0, length($0) - length(suffix) + 1) == suffix
              next
            }
            printing { print }
            END { if (!printing) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
