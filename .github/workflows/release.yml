name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # Run tests before release
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Validate Release Version
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install Wasmtime
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://wasmtime.dev/install.sh -o "$RUNNER_TEMP/install-wasmtime.sh"
          bash "$RUNNER_TEMP/install-wasmtime.sh" --version v50.0.1
          "$HOME/.wasmtime/bin/wasmtime" --version
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        if: matrix.shard == 0
        run: bun run typecheck

      - name: Lint
        if: matrix.shard == 0
        run: bun run lint

      - name: Build Transform
        run: bun run build:transform

      - name: Test pnpm Packed Consumers
        if: matrix.shard == 0
        run: npm run test:package:pnpm

      - name: Test Packed Consumer
        if: matrix.shard == 0
        run: npm run test:package

      - name: Test Transform
        run: node scripts/run-transform-shard.mjs ${{ matrix.shard }} 8

      - name: Test Benchmark Tooling
        if: matrix.shard == 0
        run: bun run test:bench

      - name: Run Tests (Slow)
        if: matrix.shard == 1
        run: JSON_USE_FAST_PATH=0 bun run test:ci -- --no-cache

      - name: Run Tests (Fast)
        if: matrix.shard == 2
        run: JSON_USE_FAST_PATH=1 bun run test:ci -- --no-cache

      - name: Run Strict Public Tests (Slow)
        if: matrix.shard == 3
        run: JSON_USE_FAST_PATH=0 bun run test:rfc:public -- --no-cache

      - name: Run Strict Tests (Fast)
        if: matrix.shard == 4
        run: JSON_USE_FAST_PATH=1 bun run test:rfc -- --no-cache

      - name: Check Package Contents
        if: matrix.shard == 0
        run: npm pack --dry-run --ignore-scripts

  # Create GitHub Release
  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: npm ci

      - name: Build Transform
        run: bun run build:transform

      - name: Generate Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v suffix=" - v${VERSION}" '
            /^## / {
              if (printing) exit
              printing = substr($0, length($0) - length(suffix) + 1) == suffix
              next
            }
            printing { print }
            END { if (!printing) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') || contains(github.ref, '-preview') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
